name: Deploy to dev

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      seed_on_start:
        description: Run prisma seed on container start (first deploy only)
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "521018312783"
  ECR_REPOSITORY: minneanalytics-dev
  TF_DIR: infra/dev

jobs:
  deploy:
    name: Deploy to AWS dev
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::521018312783:role/dev-github-deploy
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build Next.js app
        run: npm ci && npm run build

      - name: Verify Docker build context
        run: |
          test -d .next/standalone
          test -d .next/static
          test -d node_modules/.prisma

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform apply (ensure ECR exists)
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -target=aws_ecr_repository.app

      - name: Login to ECR
        id: ecr
        run: |
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$REGISTRY"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: image
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ github.sha }}"
          docker build --progress=plain -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Terraform apply (deploy image)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_container_image: ${{ steps.image.outputs.uri }}
          # GHA omits falsy booleans from env; always emit an explicit string for TF_VAR_*.
          TF_VAR_seed_on_start: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.seed_on_start == 'true' && 'true' || 'false' }}
        run: terraform apply -auto-approve

      - name: Wait for ECS rollout
        run: |
          set -euo pipefail
          CLUSTER=$(terraform -chdir=$TF_DIR output -raw ecs_cluster_name)
          SERVICE=$(terraform -chdir=$TF_DIR output -raw ecs_service_name)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment >/dev/null
          echo "Waiting for service to stabilize (up to 15 min)..."
          for attempt in $(seq 1 60); do
            read -r ROLLOUT RUNNING DESIRED <<< "$(
              aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
                --query 'services[0].[deployments[?status==`PRIMARY`].rolloutState | [0], runningCount, desiredCount]' \
                --output text
            )"
            echo "attempt ${attempt}: rollout=${ROLLOUT} running=${RUNNING}/${DESIRED}"
            if [ "$ROLLOUT" = "COMPLETED" ] && [ "$RUNNING" = "$DESIRED" ] && [ "$RUNNING" != "0" ]; then
              echo "Service is stable."
              exit 0
            fi
            sleep 15
          done
          echo "Service did not stabilize in time."
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE"
          exit 1

      - name: Deployment summary
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "## Dev deployment"
            echo "URL: $(terraform output -raw app_url)"
            echo "Image: ${{ steps.image.outputs.uri }}"
          } >> "$GITHUB_STEP_SUMMARY"
