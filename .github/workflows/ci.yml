name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, concept-design/v0-implementation]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run docs:validate
      - run: npm run db:migration:verify
      - run: npx prisma validate
        env:
          DATABASE_URL: file:./ci-migrate.db
      - name: Apply fresh migration chain
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./ci-migrate.db
      - name: Generate migration baseline report
        run: npm run db:migration:report -- --environment ci --out-dir /tmp/minne-migration-report
        env:
          DATABASE_URL: file:./ci-migrate.db
      - name: Verify 004-B canonical history semantics
        run: |
          npm run db:004-b:verify
          npm run db:004-b:vocabulary-verify
        env:
          DATABASE_URL: file:./ci-migrate.db
          MINNE_V0_WRITE_REVISION_EVALUATION: "true"
      - name: Verify 004-C participation and Deliverable semantics
        run: npm run db:004-c:verify
        env:
          DATABASE_URL: file:./ci-migrate.db
          MINNE_V0_WRITE_SELECTION_PARTICIPATION: "true"
      - name: Verify 004-D lifecycle authority and disclosure semantics
        run: npm run db:004-d:verify
        env:
          DATABASE_URL: file:./ci-migrate.db
          MINNE_V0_WRITE_REVISION_EVALUATION: "true"
          MINNE_V0_WRITE_SELECTION_PARTICIPATION: "true"
          MINNE_V0_WRITE_LIFECYCLE_DISCLOSURE: "true"
      - name: Verify 004-E Publication, Schedule and Dispatch semantics
        run: npm run db:004-e:verify
        env:
          DATABASE_URL: file:./ci-migrate.db
          MINNE_V0_WRITE_REVISION_EVALUATION: "true"
          MINNE_V0_WRITE_SELECTION_PARTICIPATION: "true"
          MINNE_V0_WRITE_LIFECYCLE_DISCLOSURE: "true"
          MINNE_V0_WRITE_PUBLICATION: "true"
          MINNE_V0_WRITE_SCHEDULE: "true"
          MINNE_V0_WRITE_DISPATCH: "true"
      - name: Verify 004-F semantic reads and first-party cutover
        run: npm run db:004-f:verify
        env:
          DATABASE_URL: file:./ci-migrate.db
          MINNE_V0_WRITE_REVISION_EVALUATION: "true"
          MINNE_V0_WRITE_SELECTION_PARTICIPATION: "true"
          MINNE_V0_WRITE_LIFECYCLE_DISCLOSURE: "true"
          MINNE_V0_WRITE_PUBLICATION: "true"
          MINNE_V0_WRITE_SCHEDULE: "true"
          MINNE_V0_WRITE_DISPATCH: "true"
          MINNE_V0_SEMANTIC_READS: "true"
      - name: Verify 004-G read rollback, projection repair and writer floors
        run: npm run db:004-g:verify
        env:
          DATABASE_URL: file:./ci-migrate.db
          MINNE_V0_SEMANTIC_READS: "true"
      - name: Rehearse fresh deployment bootstrap
        run: npm run db:migration:deploy-bootstrap
        env:
          DATABASE_URL: file:./ci-deploy-fresh.db
          DATA_DIR: /tmp/minne-ci-fresh
          MIGRATION_ENVIRONMENT: ci-fresh-bootstrap
          MINNE_RUN_SEMANTIC_BACKFILLS: "true"
      - name: Rehearse existing database backup, adoption and semantic backfills
        run: |
          cp prisma/prisma/dev.db prisma/ci-existing.db
          npm run db:migration:deploy-bootstrap
          npx prisma migrate status
        env:
          DATABASE_URL: file:./ci-existing.db
          DATA_DIR: /tmp/minne-ci-existing
          MIGRATION_ENVIRONMENT: ci-existing-bootstrap
          MINNE_ALLOW_LEGACY_BASELINE_ADOPTION: "true"
          MINNE_RUN_SEMANTIC_BACKFILLS: "true"
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: file:./ci-migrate.db
          MINNE_V0_SEMANTIC_READS: "true"
      - name: Build production deployment image
        run: docker build -t minneanalytics-004-g-ci .
