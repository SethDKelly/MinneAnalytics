name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, concept-design/v0-implementation]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run docs:validate
      - run: npm run db:migration:verify
      - run: npx prisma validate
        env:
          DATABASE_URL: file:./ci-migrate.db
      - name: Apply fresh migration chain
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./ci-migrate.db
      - name: Generate migration baseline report
        run: npm run db:migration:report -- --environment ci --out-dir /tmp/minne-migration-report
        env:
          DATABASE_URL: file:./ci-migrate.db
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: file:./ci-migrate.db
