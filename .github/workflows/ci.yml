name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, concept-design/v0-implementation]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run docs:validate
      - run: npm run db:migration:verify
      - run: npx prisma validate
        env:
          DATABASE_URL: file:./ci-migrate.db
      - name: Apply fresh migration chain
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./ci-migrate.db
      - name: Generate migration baseline report
        run: npm run db:migration:report -- --environment ci --out-dir /tmp/minne-migration-report
        env:
          DATABASE_URL: file:./ci-migrate.db
      - name: Verify 004-B canonical history semantics
        run: |
          npm run db:004-b:verify
          npm run db:004-b:vocabulary-verify
        env:
          DATABASE_URL: file:./ci-migrate.db
          MINNE_V0_WRITE_REVISION_EVALUATION: "true"
      - name: Verify 004-C participation and Deliverable semantics
        run: npm run db:004-c:verify
        env:
          DATABASE_URL: file:./ci-migrate.db
          MINNE_V0_WRITE_SELECTION_PARTICIPATION: "true"
      - name: Rehearse existing database adoption and semantic backfills
        run: |
          cp prisma/prisma/dev.db prisma/ci-existing.db
          npx prisma migrate resolve --applied 20260904000000_baseline
          npx prisma migrate deploy
          npm run db:migration:report -- --environment ci-existing --out-dir /tmp/minne-existing-migration-report
          npm run db:004-b:vocabulary-backfill -- --apply --environment ci-existing --out-dir /tmp/minne-004-b-vocabulary
          npm run db:004-b:backfill -- --apply --environment ci-existing --out-dir /tmp/minne-004-b-backfill
          npm run db:004-c:backfill -- --apply --environment ci-existing --out-dir /tmp/minne-004-c-backfill
        env:
          DATABASE_URL: file:./ci-existing.db
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: file:./ci-migrate.db
