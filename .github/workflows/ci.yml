name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run docs:validate
      - run: npm run db:migration:verify
      - run: npx prisma validate
        env:
          DATABASE_URL: file:./prisma/ci.db
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: file:./prisma/ci.db
